<tr>
    <td><a href="%1$s" title="%2$s">%1$s</a></td>
    <td><input name="consent" type="checkbox" disabled %4$s/></td>
    <td><a data-js="check-solid-connection"></a></td>
    <td><input name="dongle" type="checkbox" disabled %5$s/></td>
    <td>
        <label>
            <input name="api-key" type="password" disabled value="%6$s"/>
            <a aria-hidden="true" data-js="show-password" title="Show password">👁️</a>
        </label>
    </td>
    <td title="MAC address(es) of the P1 dongle(s) connected to this WebID">%7$s</td>
    <td title="Number of data records not yet written to the Solid Pod">%8$s</td>
    <td title="Storage URL this WebID writes to">%9$s</td>
    <td>
        <form action="/admin/manage" method="POST">
            <input type="hidden" name="webid" value="%1$s"/>
            <label><input data-js="make-admin" name="makeAdmin" type="checkbox" %3$s/></label>
            <button type="submit">Update</button>
        </form>
    </td>
    <td>
        <form action="/api/recovery/" method="POST" data-js="recover-auth">
            <input type="hidden" name="webid" value="%1$s"/>
            <button type="submit" title="Re-issue the offline grant for this WebID via the Solid Pod provider">Recover auth</button>
        </form>
    </td>
</tr>
