<tr>
    <td><a href="%1$s" title="%2$s">%1$s</a></td>
    <td><input type="checkbox" disabled %3$s/></td>
    <td><input type="checkbox" disabled %4$s/></td>
    <td><input type="checkbox" disabled %5$s/></td>
    <td><input type="password" disabled value="%6$s"/><a
        onmouseover="this.previousSibling.style.color='var(--color-link, #888)';"
        onmouseout="this.previousSibling.style.color='';"
        onclick="this.previousSibling.type === 'text'?this.previousSibling.type='password':this.previousSibling.type='text';"
    >👁️</a></td>
</tr>
