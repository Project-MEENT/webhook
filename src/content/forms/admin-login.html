<form action="/admin/login" method="POST">
    <fieldset><legend>Admin WebID</legend>
        <label>Please provide your Solid WebID:
            <input
                name="webid"
                placeholder="https://example.com/profile#me"
                required
                type="url"
                value="{webid}"
            />
        </label>
    </fieldset>
    <button>Authenticate</button>
</form>
