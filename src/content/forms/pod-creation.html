<form action="/api/pod/" data-js="pod-creation-form" method="POST">
    <p>Provide a MAC Adress to create a Solid Pod and receive the Web ID of the created Pod</p>
    <fieldset data-js="headers">
        <legend>Headers (sent by dongle)</legend>
        <label>X-Client-Secret<input name="X-Client-Secret" placeholder="0a1b2c3d4e5f6a7b8c9d0e0f1a2b3c4d5e6f7a8b9c0d0e1f2a3b4c5d6e7f8a9b" type="text" /></label>
    </fieldset>
    <fieldset>
        <legend>API Version</legend>
        <label>
            <select name="api-version">
                <option value="v0.5">v0.5</option>
                <option selected value="">latest</option>
            </select>
        </label>
    </fieldset>
    <fieldset>
        <legend>MAC Address</legend>
        <label>
            <input name="mac" placeholder="00000ABB28FC" required type="text" value="{mac}">
        </label>
    </fieldset>
    <button type="submit">Create Solid Pod</button>
</form>
